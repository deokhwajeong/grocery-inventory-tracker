<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Grocery Inventory Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#E8DED2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Capacitor Core (for native iOS/Android support) -->
    <script type="module" src="https://unpkg.com/@capacitor/core@6.0.0/dist/capacitor.js"></script>
    
    <!-- EXIF.js for image orientation correction (especially for iOS) -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container">
            <a class="navbar-brand" href="/">🛒 Grocery Inventory Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">📦 Inventory</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/shopping-list">🛒 Shopping</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/statistics">📊 Stats</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            ➕ Add
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/add">➕ Manual Entry</a></li>
                            <li><a class="dropdown-item" href="/ocr">📸 Scan Receipt</a></li>
                            <li><a class="dropdown-item" href="/barcode">📱 Scan Barcode</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/settings">⚙️ Settings</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="mt-5 py-3">
        <div class="container text-center text-muted">
            <p class="mb-0" style="font-size: 0.875rem;">&copy; 2026 Grocery Inventory Tracker | Smart Food Management</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Register service worker for PWA and notifications
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/service-worker.js')
                .then(registration => {
                    console.log('Service Worker registered:', registration);
                    
                    // Check for expiring items and show notifications
                    checkExpiringItems();
                })
                .catch(error => {
                    console.log('Service Worker registration failed:', error);
                });
        }
        
        // Check for expiring items daily
        function checkExpiringItems() {
            fetch('/api/notifications/check')
                .then(response => response.json())
                .then(data => {
                    if (Notification.permission === 'granted') {
                        // Show notification for items expiring today
                        if (data.today && data.today.length > 0) {
                            new Notification('⚠️ Items Expiring Today!', {
                                body: `${data.today.length} item(s) expire today: ${data.today.map(i => i.name).join(', ')}`,
                                icon: '/static/icons/icon-192x192.png',
                                tag: 'expiry-today'
                            });
                        }
                        
                        // Show notification for items expiring tomorrow
                        if (data.tomorrow && data.tomorrow.length > 0) {
                            new Notification('📅 Items Expiring Tomorrow', {
                                body: `${data.tomorrow.length} item(s) expire tomorrow: ${data.tomorrow.map(i => i.name).join(', ')}`,
                                icon: '/static/icons/icon-192x192.png',
                                tag: 'expiry-tomorrow'
                            });
                        }
                    }
                })
                .catch(error => console.log('Error checking notifications:', error));
        }
        
        // Check notifications daily
        setInterval(checkExpiringItems, 24 * 60 * 60 * 1000); // 24 hours
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
