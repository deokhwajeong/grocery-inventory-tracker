{% extends "layout.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="panel auth-panel">
            <h1 class="mb-1">Sign in</h1>
            <p class="text-muted mb-4">Sign in to your household account. Everyone in the household can share one login.</p>

            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ next or '' }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}"
                           autocomplete="username" autocapitalize="none" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
                </div>
            </form>
            <p class="small text-muted mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create a household account</a>.</p>
        </div>
    </div>
</div>
<script>
    // Signed out: drop pages cached for offline use by the previous household.
    if ('caches' in window) {
        caches.keys().then(keys => keys.forEach(key => caches.delete(key))).catch(() => {});
    }
</script>
{% endblock %}
