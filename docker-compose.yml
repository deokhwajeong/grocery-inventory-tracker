services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      # Required in production. Example: export SECRET_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY before running docker compose}
    restart: unless-stopped
