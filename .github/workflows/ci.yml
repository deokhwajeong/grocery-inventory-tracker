name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test with coverage gate
        # fail_under in pyproject.toml fails the job below 80% line coverage
        run: pytest -v --cov --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python -c "import xml.etree.ElementTree as ET; r=float(ET.parse('coverage.xml').getroot().get('line-rate')); print(f'### Line coverage: {r*100:.1f}% (gate: 80%)')" >> "$GITHUB_STEP_SUMMARY"
          fi
